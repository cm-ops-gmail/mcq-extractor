<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>MCQ Scraper</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23171717'/%3E%3Cpath d='M18 33l9 9 19-21' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Tokens from the 10 Minute School design system (local-design-system.10minuteschool.net) */
  :root {
    --radius: .625rem;
    --radius-sm: calc(var(--radius) - 4px);
    --radius-md: calc(var(--radius) - 2px);
    --radius-lg: var(--radius);
    --radius-xl: calc(var(--radius) + 4px);
    --background: oklch(100% 0 0);
    --secondary-background: oklch(98.4% 0 0);
    --foreground: oklch(14.5% 0 0);
    --card: oklch(100% 0 0);
    --card-foreground: oklch(14.5% 0 0);
    --popover: oklch(100% 0 0);
    --popover-foreground: oklch(14.5% 0 0);
    --primary: oklch(20.5% 0 0);
    --primary-foreground: oklch(98.5% 0 0);
    --secondary: oklch(97% 0 0);
    --secondary-foreground: oklch(20.5% 0 0);
    --muted: oklch(97% 0 0);
    --muted-foreground: oklch(55.6% 0 0);
    --accent: oklch(97% 0 0);
    --accent-foreground: oklch(20.5% 0 0);
    --destructive: oklch(57.7% .245 27.325);
    --border: oklch(92.2% 0 0);
    --input: oklch(92.2% 0 0);
    --ring: oklch(70.8% 0 0);
    --chart-1: oklch(64.6% .222 41.116);
    --chart-2: oklch(60% .118 184.704);
    --chart-3: oklch(39.8% .07 227.392);
    --chart-4: oklch(82.8% .189 84.429);
    --chart-5: oklch(76.9% .188 70.08);
    --main-gray: oklch(98.5% .001 247);
    --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / .1), 0 1px 2px -1px rgb(0 0 0 / .1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1);
  }
  .dark {
    --background: oklch(14.5% 0 0);
    --secondary-background: oklch(20.5% 0 0);
    --foreground: oklch(98.5% 0 0);
    --card: oklch(20.5% 0 0);
    --card-foreground: oklch(98.5% 0 0);
    --popover: oklch(20.5% 0 0);
    --popover-foreground: oklch(98.5% 0 0);
    --primary: oklch(92.2% 0 0);
    --primary-foreground: oklch(20.5% 0 0);
    --secondary: oklch(26.9% 0 0);
    --secondary-foreground: oklch(98.5% 0 0);
    --muted: oklch(26.9% 0 0);
    --muted-foreground: oklch(70.8% 0 0);
    --accent: oklch(26.9% 0 0);
    --accent-foreground: oklch(98.5% 0 0);
    --destructive: oklch(70.4% .191 22.216);
    --border: oklch(100% 0 0 / .1);
    --input: oklch(100% 0 0 / .15);
    --ring: oklch(55.6% 0 0);
    --chart-1: oklch(48.8% .243 264.376);
    --chart-2: oklch(69.6% .17 162.48);
    --chart-3: oklch(76.9% .188 70.08);
    --chart-4: oklch(62.7% .265 303.9);
    --chart-5: oklch(64.5% .246 16.439);
    --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / .4);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / .5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.light) {
      --background: oklch(14.5% 0 0); --secondary-background: oklch(20.5% 0 0); --foreground: oklch(98.5% 0 0);
      --card: oklch(20.5% 0 0); --card-foreground: oklch(98.5% 0 0); --popover: oklch(20.5% 0 0); --popover-foreground: oklch(98.5% 0 0);
      --primary: oklch(92.2% 0 0); --primary-foreground: oklch(20.5% 0 0); --secondary: oklch(26.9% 0 0); --secondary-foreground: oklch(98.5% 0 0);
      --muted: oklch(26.9% 0 0); --muted-foreground: oklch(70.8% 0 0); --accent: oklch(26.9% 0 0); --accent-foreground: oklch(98.5% 0 0);
      --destructive: oklch(70.4% .191 22.216); --border: oklch(100% 0 0 / .1); --input: oklch(100% 0 0 / .15); --ring: oklch(55.6% 0 0);
      --chart-1: oklch(48.8% .243 264.376); --chart-2: oklch(69.6% .17 162.48); --chart-3: oklch(76.9% .188 70.08);
      --chart-4: oklch(62.7% .265 303.9); --chart-5: oklch(64.5% .246 16.439);
      --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / .4); --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / .5);
    }
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  html.light { color-scheme: light; }
  html.dark { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; color: var(--foreground); background: var(--secondary-background);
    font: 15px/1.55 "Geist", "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 960px; margin: 0 auto; padding: 28px 20px 64px; }

  /* top bar */
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 36px; animation: rise .6s both; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.05rem; letter-spacing: -.01em; }
  .logo { width: 34px; height: 34px; border-radius: var(--radius-md); display: grid; place-items: center;
          background: var(--primary); color: var(--primary-foreground); }
  .logo svg { width: 20px; height: 20px; }
  .logo path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .9s .4s forwards ease-out; }
  .icon-btn { width: 36px; height: 36px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--card);
              color: var(--foreground); cursor: pointer; display: grid; place-items: center; box-shadow: var(--shadow-sm);
              transition: background .2s, transform .3s; }
  .icon-btn:hover { background: var(--accent); transform: rotate(20deg); }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn .moon { display: none; }
  html.dark .icon-btn .sun { display: none; }
  html.dark .icon-btn .moon { display: block; }
  @media (prefers-color-scheme: dark) {
    html:not(.light) .icon-btn .sun { display: none; }
    html:not(.light) .icon-btn .moon { display: block; }
  }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .card { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border);
          border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); }

  /* one view at a time */
  [data-view] { display: none; }
  main[data-state="idle"] [data-view="idle"],
  main[data-state="error"] [data-view="idle"],
  main[data-state="working"] [data-view="working"],
  main[data-state="done"] [data-view="done"] { display: block; animation: rise .5s both; }

  /* ---------- drop zone ---------- */
  .drop { position: relative; padding: 72px 24px; text-align: center; cursor: pointer; outline: none; border-style: dashed;
          border-width: 1.5px; border-color: var(--input); transition: border-color .25s, background .25s, transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
          animation: rise .6s .1s both; }
  .drop:hover, .drop:focus-visible { border-color: var(--ring); transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .drop:focus-visible { box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent); }
  .drop.over { border-color: var(--primary); background: var(--accent); transform: scale(1.012); }
  .drop .icon { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: var(--radius-xl); display: grid; place-items: center;
                background: var(--primary); color: var(--primary-foreground); box-shadow: var(--shadow-lg); animation: float 3.6s ease-in-out infinite; }
  .drop .icon svg { width: 30px; height: 30px; }
  .drop.over .icon { animation-duration: .9s; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .drop strong { display: block; font-size: 1.15rem; font-weight: 600; letter-spacing: -.01em; }
  .drop .sub { color: var(--muted-foreground); margin-top: 4px; }
  .chips { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
  .chip { font: 500 .78rem "Geist Mono", ui-monospace, monospace; padding: 3px 10px; border-radius: 999px; background: var(--secondary); color: var(--secondary-foreground);
          border: 1px solid var(--border); }
  main[data-state="error"] .drop { animation: shake .45s; border-color: var(--destructive); }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .error { display: none; margin: 14px 0 0; padding: 12px 16px; border-radius: var(--radius-lg); font-weight: 500;
           color: var(--destructive); background: color-mix(in oklch, var(--destructive) 10%, transparent);
           border: 1px solid color-mix(in oklch, var(--destructive) 30%, transparent); animation: rise .35s both; }
  main[data-state="error"] .error { display: block; }

  /* ---------- working ---------- */
  .work { padding: 28px; }
  .file { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .file .doc { width: 44px; height: 44px; border-radius: var(--radius-lg); display: grid; place-items: center; flex: none;
               font: 600 .68rem "Geist Mono", ui-monospace, monospace; background: var(--primary); color: var(--primary-foreground); }
  .file .name { font-weight: 600; overflow-wrap: anywhere; }
  .file .size { color: var(--muted-foreground); font-size: .88rem; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: var(--muted-foreground); font-size: .84rem; transition: color .3s; }
  .step i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 600; font-size: .85rem;
            border: 1.5px solid var(--border); background: var(--card); transition: all .35s; }
  .step.active { color: var(--foreground); }
  .step.active i { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 0 4px color-mix(in oklch, var(--primary) 12%, transparent); animation: pulse 1.4s ease-in-out infinite; }
  .step.done { color: var(--foreground); }
  .step.done i { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 9px transparent; } }
  .bar { height: 8px; border-radius: 999px; background: var(--secondary); overflow: hidden; border: 1px solid var(--border); }
  .bar > div { height: 100%; width: 0; border-radius: inherit; position: relative; background: var(--primary); transition: width .45s cubic-bezier(.2,.8,.2,1); overflow: hidden; }
  .bar > div::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); animation: shimmer 1.3s infinite;
                      background: linear-gradient(100deg, transparent 20%, color-mix(in oklch, var(--primary-foreground) 45%, transparent) 50%, transparent 80%); }
  @keyframes shimmer { to { transform: translateX(100%); } }
  .progress-meta { display: flex; justify-content: space-between; margin-top: 10px; color: var(--muted-foreground); font-size: .88rem; }

  /* ---------- done ---------- */
  .result { padding: 28px; }
  .success { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .tick { width: 52px; height: 52px; flex: none; }
  .tick circle { fill: none; stroke: var(--chart-2); stroke-width: 3.5; stroke-dasharray: 176; stroke-dashoffset: 176; animation: draw .7s ease-out forwards; }
  .tick path { fill: none; stroke: var(--chart-2); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 50; stroke-dashoffset: 50; animation: draw .45s .55s ease-out forwards; }
  .success h2 { margin: 0; font-size: 1.25rem; font-weight: 600; letter-spacing: -.01em; }
  #status { margin: 2px 0 0; color: var(--muted-foreground); font-size: .9rem; max-width: 620px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat { position: relative; padding: 14px 16px 14px 20px; border-radius: var(--radius-lg); background: var(--background); border: 1px solid var(--border);
          animation: pop .5s both; overflow: hidden; }
  .stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, var(--primary)); }
  .stat:nth-child(1) { --c: var(--chart-1); } .stat:nth-child(2) { --c: var(--chart-2); } .stat:nth-child(3) { --c: var(--chart-3); }
  .stat:nth-child(4) { --c: var(--chart-4); } .stat:nth-child(5) { --c: var(--destructive); }
  .stat:nth-child(2) { animation-delay: .05s; } .stat:nth-child(3) { animation-delay: .1s; } .stat:nth-child(4) { animation-delay: .15s; } .stat:nth-child(5) { animation-delay: .2s; }
  .stat b { display: block; font-size: 1.75rem; font-weight: 600; letter-spacing: -.03em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted-foreground); font-size: .82rem; }
  .stat.bad b { color: var(--destructive); }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; }
  .btn { border: 1px solid transparent; border-radius: var(--radius-md); padding: 10px 18px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px;
         transition: transform .2s, box-shadow .25s, background .2s; }
  .btn svg { width: 18px; height: 18px; }
  .btn.primary { background: var(--primary); color: var(--primary-foreground); box-shadow: var(--shadow-sm); }
  /* no movement on hover: a button that shifts under the pointer can swallow the first click */
  .btn.primary:hover { box-shadow: var(--shadow-lg); background: color-mix(in oklch, var(--primary) 90%, transparent); }
  .btn.outline { background: var(--background); color: var(--foreground); border-color: var(--input); box-shadow: var(--shadow-sm); }
  .btn.outline:hover { background: var(--accent); }
  .btn:focus-visible { outline: 3px solid color-mix(in oklch, var(--ring) 50%, transparent); outline-offset: 2px; }

  .preview { margin-top: 22px; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); background: var(--background); }
  .preview h3 { margin: 0; padding: 14px 18px; font-size: .9rem; font-weight: 600; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .preview h3 small { color: var(--muted-foreground); font-weight: 400; }
  .scroll { max-height: 440px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { padding: 10px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
  th { position: sticky; top: 0; z-index: 1; background: var(--secondary-background); font-size: .72rem; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: var(--muted-foreground); }
  tbody tr { animation: rise .4s both; transition: background .15s; }
  tbody tr:hover { background: var(--muted); }
  td.title { min-width: 240px; max-width: 380px; }
  td.title div { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  td.board { max-width: 150px; font-size: .8rem; color: var(--muted-foreground); }
  td.chapter { min-width: 120px; max-width: 190px; color: var(--muted-foreground); font-size: .82rem; }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font: 500 .74rem "Geist Mono", ui-monospace, monospace; white-space: nowrap; border: 1px solid transparent; }
  .pill.failed { color: var(--destructive); background: color-mix(in oklch, var(--destructive) 12%, transparent); border-color: color-mix(in oklch, var(--destructive) 30%, transparent); }
  .pill.m4 { color: var(--chart-1); background: color-mix(in oklch, var(--chart-1) 12%, transparent); border-color: color-mix(in oklch, var(--chart-1) 30%, transparent); }
  .pill.m1 { color: var(--chart-2); background: color-mix(in oklch, var(--chart-2) 12%, transparent); border-color: color-mix(in oklch, var(--chart-2) 30%, transparent); }
  .pill.ans { background: var(--primary); color: var(--primary-foreground); min-width: 26px; text-align: center; font-family: "Noto Sans Bengali", "Geist", sans-serif; }

  @media (max-width: 640px) {
    main { padding: 20px 14px 48px; }
    .steps { grid-template-columns: repeat(2, 1fr); }
    .work, .result { padding: 20px; }
    .drop { padding: 48px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
  }
</style>
</head>
<body>
<main id="app" data-state="idle">
  <div class="top">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></span>
      MCQ Scraper
    </div>
    <button class="icon-btn" id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>

  <!-- upload -->
  <section data-view="idle">
    <div class="drop card" id="drop" tabindex="0" role="button" aria-label="Choose a .docx or .docm file">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></div>
      <strong>Drop your Word file here</strong>
      <div class="sub">or click to browse</div>
      <div class="chips"><span class="chip">.docx</span><span class="chip">.docm</span></div>
    </div>
    <div class="error" id="error" role="alert"></div>
  </section>

  <!-- working -->
  <section data-view="working">
    <div class="work card">
      <div class="file"><div class="doc" id="docExt">DOCX</div><div><div class="name" id="fileName"></div><div class="size" id="fileSize"></div></div></div>
      <div class="steps" id="steps">
        <div class="step" data-step="1"><i>1</i>Read file</div>
        <div class="step" data-step="2"><i>2</i>Find questions</div>
        <div class="step" data-step="3"><i>3</i>Process pictures</div>
        <div class="step" data-step="4"><i>4</i>Build sheet</div>
      </div>
      <div class="bar"><div id="barFill"></div></div>
      <div class="progress-meta"><span id="progressText">Starting…</span><span id="progressPct">0%</span></div>
    </div>
  </section>

  <!-- done -->
  <section data-view="done">
    <div class="result card">
      <div class="success">
        <svg class="tick" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28"/><path d="M19 33l9 9 18-19"/></svg>
        <div><h2>Your spreadsheet is ready</h2><p id="status" role="status"></p></div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="actions" id="actions">
        <button class="btn primary" id="download" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 18v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1"/></svg><span id="downloadLabel">Download .xlsx</span></button>
        <button class="btn outline" id="again" type="button">Convert another file</button>
      </div>
      <div class="preview" id="preview"></div>
    </div>
  </section>

  <input id="file" type="file" accept=".docx,.docm,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-word.document.macroEnabled.12" hidden>
</main>

<noscript><p style="text-align:center">This tool needs JavaScript.</p></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="config.js"></script>
<script src="parser.js"></script>
<script src="core.js"></script>
<script src="images.js"></script>
<script src="app.js"></script>
</body>
</html>
